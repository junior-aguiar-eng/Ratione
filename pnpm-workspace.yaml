packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true

# Correções de segurança (Dependabot). Remover quando as dependências de origem as trouxerem:
# - next@15 fixa postcss@8.4.31 (corrigido em >= 8.5.23; o Next 16 já usa 8.5.23).
# - tailwindcss@3 usa postcss-selector-parser@6 (corrigido apenas na linha 7, >= 7.1.6).
overrides:
  "next>postcss": "^8.5.23"
  "postcss-selector-parser": "^7.1.6"
