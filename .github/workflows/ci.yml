name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, testes, gabarito e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # Mesma versão do pnpm fixada em package.json ("packageManager")
      - name: Instalar pnpm
        run: npm install -g pnpm@11.19.0

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # next-env.d.ts e os tipos de rota são gerados pelo Next e não ficam no repositório
      - name: Tipos de rota do Next
        run: pnpm --filter web exec next typegen

      - name: Tipos
        run: pnpm -r exec tsc --noEmit

      - name: Testes
        run: pnpm test

      # O gabarito dos cenários vem do oráculo independente em Python; se o JSON versionado
      # divergir do que o oráculo gera, alguém mudou um sem o outro.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Gabarito e documento de revisão em sincronia com o oráculo
        run: |
          python packages/prazozero/cenarios/oraculo.py
          git diff --exit-code -- packages/prazozero/cenarios/cenarios.json packages/prazozero/cenarios/cenarios_aleatorios.json docs/produto/REVISAO_CENARIOS.md docs/produto/VALIDACAO_PENDENTES.md

      - name: Build
        run: pnpm build
